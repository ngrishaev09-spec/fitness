<!DOCTYPE html>

<title>Персональная программа тренировок</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    color: #1a1a2e;
  }
  
  .container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
  }
  
  .progress-bar {
    height: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff6b35, #ff8c42);
    border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
  }
  
  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    animation: fadeIn 0.4s ease;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .hidden { display: none !important; }
  
  .welcome-icon {
    font-size: 56px;
    text-align: center;
    margin-bottom: 16px;
  }
  
  h1 {
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #ff6b35, #ff8c42);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  .subtitle {
    font-size: 15px;
    color: #555;
    text-align: center;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  
  .question-icon {
    font-size: 40px;
    text-align: center;
    margin-bottom: 12px;
  }
  
  .question-title {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 6px;
  }
  
  .question-subtitle {
    font-size: 14px;
    color: #777;
    text-align: center;
    margin-bottom: 20px;
  }
  
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  
  .option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    background: #f8f9fc;
    border: 2px solid #e8ecf3;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    font-size: 15px;
    font-family: inherit;
    color: #1a1a2e;
    width: 100%;
  }
  
  .option-btn:hover {
    border-color: #ff6b35;
    background: #fff5f0;
    transform: translateY(-2px);
  }
  
  .option-btn.selected {
    border-color: #ff6b35;
    background: linear-gradient(135deg, #fff5f0, #ffe8dc);
  }
  
  .option-emoji { font-size: 24px; flex-shrink: 0; }
  .option-text { flex: 1; }
  .option-label { font-weight: 600; display: block; }
  .option-desc { font-size: 13px; color: #888; margin-top: 2px; }
  
  .next-btn {
    width: 100%;
    padding: 16px;
    margin-top: 20px;
    background: linear-gradient(135deg, #ff6b35, #ff8c42);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  
  .next-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,107,53,0.4); }
  .next-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  
  .back-btn {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: transparent;
    color: #888;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  
  .back-btn:hover { background: #f0f4ff; color: #4a5fc1; }
  
  /* Result */
  .result-header {
    text-align: center;
    margin-bottom: 24px;
  }
  
  .result-badge {
    display: inline-block;
    padding: 6px 14px;
    background: #f0f4ff;
    border-radius: 20px;
    font-size: 13px;
    color: #4a5fc1;
    font-weight: 600;
    margin: 4px 4px 0 0;
  }
  
  .result-section {
    margin-bottom: 20px;
    padding: 16px;
    background: #f8f9fc;
    border-radius: 12px;
  }
  
  .result-section h3 {
    font-size: 16px;
    margin-bottom: 10px;
    color: #ff6b35;
  }
  
  .result-section p, .result-section li {
    font-size: 14px;
    line-height: 1.7;
    color: #333;
  }
  
  .result-section ul { padding-left: 20px; }
  .result-section li { margin-bottom: 6px; }
  
  .day-block {
    margin-bottom: 16px;
    padding: 14px;
    background: white;
    border-radius: 10px;
    border-left: 4px solid #ff6b35;
  }
  
  .day-title {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 8px;
  }
  
  .exercise-item {
    font-size: 14px;
    line-height: 1.6;
    padding: 4px 0;
    color: #444;
  }
  
  .download-btn {
    width: 100%;
    padding: 16px;
    margin-top: 20px;
    background: linear-gradient(135deg, #4a5fc1, #6a7fd1);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  
  .download-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(74,95,193,0.4); }
  
  .restart-btn {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background: #f0f4ff;
    color: #4a5fc1;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  
  .restart-btn:hover { background: #e0e8ff; }
  
  .warning-note {
    background: #fff8e6;
    border-left: 4px solid #f5a623;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    color: #7a5c00;
    margin-bottom: 16px;
  }
  
  /* Стили для печати / PDF */
  @media print {
    body {
      background: white !important;
      padding: 0 !important;
      display: block !important;
    }
    .container { max-width: 100% !important; }
    .progress-bar,
    .download-btn,
    .restart-btn,
    .back-btn,
    .next-btn { display: none !important; }
    .card {
      box-shadow: none !important;
      border-radius: 0 !important;
      padding: 20px !important;
      animation: none !important;
    }
    .result-section {
      page-break-inside: avoid;
    }
    .day-block {
      page-break-inside: avoid;
    }
    h1 {
      -webkit-text-fill-color: #ff6b35 !important;
      color: #ff6b35 !important;
    }
  }
</style>

  'Лишний вес': 'Кардио 4–5 раз в неделю по 30–40 минут. Начинай с ходьбы, избегай ударной нагрузки.'
};

const TEMPO_EXPLANATION = {
  '2/1/2/1': '2 сек — опускание, 1 сек — пауза, 2 сек — подъём, 1 сек — пауза. Медленный, с паузами в крайних точках.',
  '1/0/1/0': '1 сек — опускание, без паузы, 1 сек — подъём, без паузы. Быстрый, для рельефа.',
  'произвольный': 'Выбирай темп сам. Главное — контроль и техника.'
};

const REPLACEMENTS = {
  'Спина': { 'Исключить': ['Становая тяга', 'Румынская тяга', 'Гиперэкстензия с весом'], 'Заменить на': ['«Лодочка» без веса', 'Планка', 'Ягодичный мост'] },
  'Колени': { 'Исключить': ['Выпады', 'Прыжки', 'Глубокие приседания'], 'Заменить на': ['Ягодичный мост', 'Приседания с опорой', 'Подъёмы на стул'] },
  'Плечи': { 'Исключить': ['Жимы над головой', 'Отжимания узким хватом', 'Разведения в стороны'], 'Заменить на': ['Разведения с лёгким весом', 'Отжимания от стены', 'Тяга к поясу'] },
  'Шея': { 'Исключить': ['Подъёмы корпуса из положения лёжа', 'Шраги', 'Жимы над головой'], 'Заменить на': ['Упражнения на растяжку шеи', 'Планка', 'Скручивания без напряжения шеи'] }
};

// ============================================================
// СОСТОЯНИЕ
// ============================================================
let currentStep = 0;
let answers = {};
let multiSelected = [];
let lastResultHTML = '';

const app = document.getElementById('app');
const progressFill = document.getElementById('progressFill');

// ============================================================
// LOCALSTORAGE
// ============================================================
const STORAGE_KEY = 'fitness_quiz_state';

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      currentStep,
      answers,
      multiSelected,
      timestamp: Date.now()
    }));
  } catch (e) {}
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return null;
    const data = JSON.parse(saved);
    // Удаляем, если старше 24 часов
    if (Date.now() - data.timestamp > 24 * 60 * 60 * 1000) {
      localStorage.removeItem(STORAGE_KEY);
      return null;
    }
    return data;
  } catch (e) {
    return null;
  }
}

function clearState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

// ============================================================
// РЕНДЕР
// ============================================================
function updateProgress() {
  const total = QUESTIONS.length;
  const pct = Math.min((currentStep / total) * 100, 100);
  progressFill.style.width = pct + '%';
}

function renderWelcome() {
  updateProgress();
  const saved = loadState();
  const savedHint = saved && saved.currentStep > 0
    ? `<button class="restart-btn" onclick="resumeQuiz()">Продолжить с прошлого раза</button>`
    : '';
  
  app.innerHTML = `
    <div class="card">
      <div class="welcome-icon">👋</div>
      <h1>Привет!</h1>
      <p class="subtitle">
        Я подберу тебе персональную программу тренировок <b>по книге Сергея Струкова</b>.<br><br>
        Ответь на 7 вопросов — и получишь план, основанный на научном подходе.<br><br>
        🚀 <b>Поехали!</b>
      </p>
      <button class="next-btn" onclick="startQuiz()">Начать опрос</button>
      ${savedHint}
    </div>
  `;
}

function startQuiz() {
  currentStep = 0;
  answers = {};
  multiSelected = [];
  clearState();
  renderQuestion();
}

function resumeQuiz() {
  const saved = loadState();
  if (!saved) { startQuiz(); return; }
  currentStep = saved.currentStep || 0;
  answers = saved.answers || {};
  multiSelected = saved.multiSelected || [];
  
  if (currentStep >= QUESTIONS.length) {
    renderResult();
  } else {
    renderQuestion();
  }
}

function renderQuestion() {
  updateProgress();
  saveState();
  const q = QUESTIONS[currentStep];
  const isMulti = q.multi || false;
  
  if (isMulti) {
    multiSelected = answers[q.id] || [];
  }
  
  const backBtn = currentStep > 0
    ? `<button class="back-btn" onclick="goBack()">← Назад</button>`
    : '';
  
  app.innerHTML = `
    <div class="card">
      <div class="question-icon">${q.icon}</div>
      <div class="question-title">${q.title}</div>
      <div class="question-subtitle">${q.subtitle}</div>
      <div class="options" id="options">
        ${q.options.map((opt, i) => {
          const isSelected = isMulti
            ? multiSelected.includes(opt.value)
            : answers[q.id] === opt.value;
          return `
            <button class="option-btn ${isSelected ? 'selected' : ''}" onclick="selectOption(${i})" data-index="${i}">
              <span class="option-emoji">${opt.emoji}</span>
              <span class="option-text">
                <span class="option-label">${opt.label}</span>
                ${opt.desc ? `<span class="option-desc">${opt.desc}</span>` : ''}
              </span>
            </button>
          `;
        }).join('')}
      </div>
      ${isMulti ? '<button class="next-btn" id="nextBtn" onclick="confirmMulti()" ' + (multiSelected.length === 0 ? 'disabled' : '') + '>Далее</button>' : ''}
      ${backBtn}
    </div>
  `;
}

function goBack() {
  if (currentStep > 0) {
    currentStep--;
    renderQuestion();
  }
}

function selectOption(index) {
  const q = QUESTIONS[currentStep];
  const opt = q.options[index];
  
  if (q.multi) {
    if (opt.value === 'Нет') {
      multiSelected = ['Нет'];
    } else {
      multiSelected = multiSelected.filter(v => v !== 'Нет');
      if (multiSelected.includes(opt.value)) {
        multiSelected = multiSelected.filter(v => v !== opt.value);
      } else {
        multiSelected.push(opt.value);
      }
    }
    answers[q.id] = multiSelected;
    
    document.querySelectorAll('.option-btn').forEach((btn, i) => {
      const val = q.options[i].value;
      btn.classList.toggle('selected', multiSelected.includes(val));
    });
    
    document.getElementById('nextBtn').disabled = multiSelected.length === 0;
    saveState();
  } else {
    answers[q.id] = opt.value;
    document.querySelectorAll('.option-btn').forEach((btn, i) => {
      btn.classList.toggle('selected', i === index);
    });
    saveState();
    
    setTimeout(() => {
      currentStep++;
      if (currentStep < QUESTIONS.length) {
        renderQuestion();
      } else {
        renderResult();
      }
    }, 250);
  }
}

function confirmMulti() {
  answers.restrictions = multiSelected;
  saveState();
  currentStep++;
  if (currentStep < QUESTIONS.length) {
    renderQuestion();
  } else {
    renderResult();
  }
}

// ============================================================
// ГЕНЕРАЦИЯ ПРОГРАММЫ
// ============================================================
function renderResult() {
  updateProgress();
  progressFill.style.width = '100%';
  
  const { goal, bodyType, inventory, level, time, frequency, restrictions } = answers;
  const params = LOAD_PARAMS[goal][level];
  const levelKey = level;
  
  const baseExercises = EXERCISES[inventory][levelKey];
  const exCount = TIME_EXERCISES[time] || 4;
  const exercises = baseExercises.slice(0, exCount);
  
  const sched = SCHEDULE[frequency];
  const invNames = { kovrik: 'Коврик', ganteli: 'Гантели', turnik: 'Брусья/турник', vse: 'Всё есть' };
  
  let restrictionNote = '';
  let replacementsHTML = '';
  if (restrictions && restrictions.length > 0 && !restrictions.includes('Нет')) {
    restrictionNote = `<div class="warning-note">⚠️ Учтены ограничения: ${restrictions.join(', ')}. Исключи опасные упражнения. При сомнениях — проконсультируйся с врачом.</div>`;
    
    let replList = '';
    restrictions.forEach(r => {
      if (REPLACEMENTS[r]) {
        replList += `<div style="margin-bottom:10px;">
          <b>${r}:</b><br>
          ❌ Исключить: ${REPLACEMENTS[r]['Исключить'].join(', ')}<br>
          ✅ Заменить на: ${REPLACEMENTS[r]['Заменить на'].join(', ')}
        </div>`;
      }
    });
    if (replList) {
      replacementsHTML = `<div class="result-section"><h3>🔁 Замены для безопасности</h3>${replList}</div>`;
    }
  }
  
  const exercisesHTML = exercises.map((ex, i) => 
    `<div class="exercise-item">${i + 1}. ${ex} — <b>${params.sets}×${params.reps}</b>, отдых ${params.rest} сек</div>`
  ).join('');
  
  lastResultHTML = `
🎉 ТВОЯ ПРОГРАММА ГОТОВА!

🎯 Цель: ${goal}
🧐 Телосложение: ${bodyType}
🧳 Инвентарь: ${invNames[inventory]}
📊 Уровень: ${level}
⏱️ Время: ${time} мин
📅 Расписание: ${sched.days}

🔥 РАЗМИНКА (5–7 мин):
• Суставная гимнастика (вращения головой, плечами, руками, тазом, коленями, стопами)
• Динамические упражнения (приседания без веса, наклоны, махи руками)
• Дыхание: 3–4 глубоких вдоха/выдоха

🏋️ ОСНОВНАЯ ЧАСТЬ (тренировка всего тела):
Каждая тренировка включает все 3 линии + кор (по книге Струкова).

${exercises.map((ex, i) => `${i + 1}. ${ex} — ${params.sets}×${params.reps}, отдых ${params.rest} сек`).join('\n')}

📝 Темп выполнения: ${params.tempo}
${TEMPO_EXPLANATION[params.tempo] || ''}

🧘 ЗАМИНКА (5–7 мин):
• Дыхательные упражнения (диафрагмальное дыхание — 5 циклов)
• Коррекция осанки (стоя у стены — 1–2 мин)
• Растяжка (по 20–30 сек на мышцу)

🍽️ ПИТАНИЕ:
${DIET_ADVICE[goal]}

💪 КАРДИО:
${CARDIO_ADVICE[bodyType]}

📈 ПРОГРЕССИЯ:
Когда выполняешь все повторения в 2 тренировках подряд — добавь 2,5–5 кг (или 1–2 повторения). Если техника ломается — снизь нагрузку.

⚠️ ВАЖНО:
• Держи спину прямой (нейтральное положение позвоночника)
• Дыши ровно, не задерживай дыхание
• Лёгкое жжение — норма, острая боль — сигнал остановиться
  `.trim();
  
  app.innerHTML = `
    <div class="card">
      <div class="result-header">
        <div class="welcome-icon">🎉</div>
        <h1>Твоя программа готова!</h1>
        <div>
          <span class="result-badge">${goal}</span>
          <span class="result-badge">${invNames[inventory]}</span>
          <span class="result-badge">${level}</span>
          <span class="result-badge">${bodyType}</span>
        </div>
      </div>
      
      ${restrictionNote}
      
      <div class="result-section">
        <h3>📅 Расписание</h3>
        <p><strong>${sched.days}</strong></p>
        <p>${sched.comment}</p>
        <p>Время тренировки: <strong>${time} мин</strong> (${exCount} упражнений)</p>
      </div>
      
      <div class="result-section">
        <h3>🔥 Разминка (5–7 мин)</h3>
        <p>Суставная гимнастика, динамические упражнения, дыхание.</p>
      </div>
      
      <div class="result-section">
        <h3>🏋️ Основная часть</h3>
        <p style="margin-bottom:10px;"><i>Тренировка всего тела — все 3 линии + кор (по книге Струкова).</i></p>
        ${exercisesHTML}
        <p style="margin-top:12px;"><b>Темп:</b> ${params.tempo}</p>
        <p style="font-size:13px; color:#666;">${TEMPO_EXPLANATION[params.tempo] || ''}</p>
      </div>
      
      <div class="result-section">
        <h3>🧘 Заминка (5–7 мин)</h3>
        <p>Дыхательные упражнения, коррекция осанки, растяжка.</p>
      </div>
      
      ${replacementsHTML}
      
      <div class="result-section">
        <h3>🍽️ Питание</h3>
        <p>${DIET_ADVICE[goal]}</p>
      </div>
      
      <div class="result-section">
        <h3>💪 Кардио</h3>
        <p>${CARDIO_ADVICE[bodyType]}</p>
      </div>
      
      <div class="result-section">
        <h3>📈 Прогрессия</h3>
        <p>Когда выполняешь все повторения в 2 тренировках подряд — добавь 2,5–5 кг (или 1–2 повторения). Если техника ломается — снизь нагрузку.</p>
      </div>
      
      <div class="result-section">
        <h3>⚠️ Важно</h3>
        <ul>
          <li>Держи спину прямой (нейтральное положение позвоночника)</li>
          <li>Дыши ровно, не задерживай дыхание</li>
          <li>Лёгкое жжение — норма, острая боль — сигнал остановиться</li>
        </ul>
      </div>
      
      <button class="download-btn" onclick="downloadPDF()">📄 Скачать PDF</button>
      <button class="download-btn" style="background: linear-gradient(135deg, #4caf50, #66bb6a);" onclick="copyResult()">📋 Скопировать текст</button>
      <button class="restart-btn" onclick="startQuiz()">Пройти заново</button>
    </div>
  `;
  
  clearState();
}

// ============================================================
// PDF И КОПИРОВАНИЕ
// ============================================================
function downloadPDF() {
  window.print();
}

function copyResult() {
  if (!lastResultHTML) return;
  navigator.clipboard.writeText(lastResultHTML).then(() => {
    const btn = event.target;
    const original = btn.textContent;
    btn.textContent = '✅ Скопировано!';
    setTimeout(() => { btn.textContent = original; }, 2000);
  }).catch(() => {
    // Fallback для старых браузеров
    const ta = document.createElement('textarea');
    ta.value = lastResultHTML;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('Текст скопирован в буфер обмена');
  });
}

// ============================================================
// СТАРТ
// ============================================================
renderWelcome();
</script>
</body>
</html>
